# Replace rel.munchaana.com and both certificate paths before enabling.
# Install in the host Nginx http context (e.g. sites-available/sites-enabled).
server {
    listen 80;
    listen [::]:80;
    server_name rel.munchaana.com;
    access_log off;
    return 301 https://rel.munchaana.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rel.munchaana.com;

    ssl_certificate /etc/letsencrypt/live/rel.munchaana.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rel.munchaana.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ORB_TLS:10m;
    ssl_session_timeout 1d;

    # OAuth callback query strings contain single-use authorization codes.
    access_log off;
    # Nginx errors may include the request URI; keep this log private.
    error_log /var/log/nginx/algo-orb-error.log crit;
    server_tokens off;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace incoming forwarded headers with values from this proxy.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_cache off;
        proxy_hide_header X-Powered-By;
    }
}

name: algo-orb

x-app: &app
  image: algo-orb:production
  build:
    context: .
  env_file:
    - path: ${ORB_ENV_FILE:-.env.production}
      format: raw
  environment:
    MYSQL_HOST: host.docker.internal
    APP_COOKIE_SECURE: "true"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - app
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  web:
    <<: *app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  worker:
    <<: *app
    profiles: ["trading"]
    command: ["python", "-m", "app.cli.run_strategy"]
    restart: "no"
    stop_grace_period: 30s

networks:
  app:
    ipam:
      config:
        - subnet: 172.30.21.0/24
          gateway: 172.30.21.1

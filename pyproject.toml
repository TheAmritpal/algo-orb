[project]
name = "algo-orb"
version = "0.1.0"
description = "Trading foundation for Upstox"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "pymysql",
    "upstox-python-sdk",
    "python-dotenv",
    "pydantic-settings",
    "alembic>=1.19.0",
    "sqlalchemy>=2.0.52",
    "pwdlib[argon2]>=0.3.1",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["mysql: requires a live MySQL test database"]

[tool.ruff]
line-length = 100
target-version = "py313"
